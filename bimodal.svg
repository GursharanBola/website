<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Two-bit saturating counter</title>
  <defs>
    <marker id="stealth" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 L3,4 Z" fill="#000"/>
    </marker>
    <style>
      text { font-family: "Latin Modern Roman", "CMU Serif", "Computer Modern", "STIX Two Text", "Times New Roman", serif; fill: #000; }
      .state { fill: none; stroke: #000; stroke-width: 0.8; }
      .edge  { fill: none; stroke: #000; stroke-width: 0.8; marker-end: url(#stealth); }
      .bin   { font-size: 22px; text-anchor: middle; }
      .lbl   { font-size: 17px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="740" height="240" fill="#fff"/>

  <circle class="state" cx="100" cy="120" r="36"/>
  <circle class="state" cx="280" cy="120" r="36"/>
  <circle class="state" cx="460" cy="120" r="36"/>
  <circle class="state" cx="640" cy="120" r="36"/>

  <text class="bin" x="100" y="128">00</text>
  <text class="bin" x="280" y="128">01</text>
  <text class="bin" x="460" y="128">10</text>
  <text class="bin" x="640" y="128">11</text>

  <!-- 1 edges (upper, left to right) -->
  <path class="edge" d="M125.5,94.5 Q190,30 254.5,94.5"/>
  <path class="edge" d="M305.5,94.5 Q370,30 434.5,94.5"/>
  <path class="edge" d="M485.5,94.5 Q550,30 614.5,94.5"/>
  <text class="lbl" x="190" y="54">1</text>
  <text class="lbl" x="370" y="54">1</text>
  <text class="lbl" x="550" y="54">1</text>

  <!-- 0 edges (lower, right to left) -->
  <path class="edge" d="M254.5,145.5 Q190,210 125.5,145.5"/>
  <path class="edge" d="M434.5,145.5 Q370,210 305.5,145.5"/>
  <path class="edge" d="M614.5,145.5 Q550,210 485.5,145.5"/>
  <text class="lbl" x="190" y="202">0</text>
  <text class="lbl" x="370" y="202">0</text>
  <text class="lbl" x="550" y="202">0</text>

  <!-- self loops -->
  <path class="edge" d="M74.5,94.5 C30,65 30,175 74.5,145.5"/>
  <text class="lbl" x="34" y="126" text-anchor="end">0</text>
  <path class="edge" d="M665.5,94.5 C710,65 710,175 665.5,145.5"/>
  <text class="lbl" x="706" y="126" text-anchor="start">1</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
